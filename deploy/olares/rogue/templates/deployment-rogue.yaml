apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: web
  name: rogue
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: {{ (index .Values.workloads "rogue").replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: web
    spec:
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: ROGUE_REGION
          value: eu
        - name: DATABASE_URL
          value: postgres://rogue:rogue-local@127.0.0.1:5432/rogue
        - name: ROGUE_BACKUP_DIR
          value: /app/backups
        - name: ROGUE_DATA_DIR
          value: /app/data
        - name: ROGUE_AI_CHAT_MODEL
          value: Olares/gemma4:e4b
        - name: ROGUE_AI_EMBED_MODEL
          value: Olares/embeddinggemma-300m
        - name: ROGUE_AI_BASE_URL
          value: '{{ .Values.rogueAiBaseUrl | default "" }}'
        - name: ROGUE_SEARCH_BASE_URL
          value: '{{ .Values.rogueSearchBaseUrl | default "" }}'
        - name: ROGUE_OCR_BASE_URL
          value: '{{ .Values.rogueOcrBaseUrl | default "" }}'
        - name: ROGUE_DISCORD_APP_ID
          value: '{{ .Values.rogueDiscordAppId | default "" }}'
        - name: ROGUE_DISCORD_PUBLIC_KEY
          value: '{{ .Values.rogueDiscordPublicKey | default "" }}'
        - name: ROGUE_OCR_API_KEY
          value: '{{ .Values.rogueOcrApiKey | default "" }}'
        image: docker.io/cisakson/rogue:{{ .Chart.AppVersion }}
        imagePullPolicy: IfNotPresent
        name: web
        ports:
        - containerPort: 4321
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4321
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4321
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: app-data
          mountPath: /app/data
          subPath: files
        - name: app-data
          mountPath: /app/backups
          subPath: backups
      - name: db
        image: docker.io/pgvector/pgvector:pg17
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          value: rogue
        - name: POSTGRES_PASSWORD
          value: rogue-local   # DB listens on pod-local 127.0.0.1 only; no Service exposes 5432
        - name: POSTGRES_DB
          value: rogue
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "rogue", "-d", "rogue"]
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: app-data
          mountPath: /var/lib/postgresql/data
          subPath: postgres
      initContainers:
      - name: fix-perms
        image: docker.io/library/busybox:1.37
        command: ["sh", "-c", "mkdir -p /d/postgres /d/files /d/backups && chown -R 999:999 /d/postgres && chown -R 1000:1000 /d/files /d/backups"]
        volumeMounts:
        - name: app-data
          mountPath: /d
      volumes:
      - name: app-data
        hostPath:
          path: '{{ .Values.userspace.appData }}'
          type: DirectoryOrCreate
      restartPolicy: Always
