apiVersion: v3
# Custom route ID is set post-deployment by scripts/deploy.sh:
# olares-cli settings apps domain set rogue rogue --third-level rogue
entrances:
- authLevel: public
  host: web
  icon: https://rogue.cisakson.olares.com/icon-256.png
  name: rogue
  openMethod: default
  port: 4321
  title: T-AI-bletop Rogue
metadata:
  appid: rogue
  categories:
  - Utilities
  description: Cited, rights-aware tabletop knowledge platform
  icon: https://rogue.cisakson.olares.com/icon-256.png
  name: rogue
  title: T-AI-bletop Rogue
  version: 0.0.136
olaresManifest.type: app
olaresManifest.version: 0.12.0
options:
  appScope: {}
  dependencies:
  - mandatory: false
    name: olares
    selfRely: false
    type: system
    version: '>=1.12.6-0'
  oidc: {}
  resetCookie: {}
  shared: false
  upload: {}
  websocket: {}
overlayGateway:
  enable: false
permission:
  appData: true
spec:
  accelerator:
  - limitedCpu: 2500m
    limitedDisk: 20Gi
    limitedMemory: 3Gi
    mode: cpu
    requiredCpu: 300m
    requiredDisk: 50Mi
    requiredMemory: 768Mi
  hardware:
    cpu: {}
    gpu: {}
  runAsInternal: false
  runAsUser: false
  supportArch:
  - amd64
  supportClient: {}
  versionName: "0.0.136"
tailscale: {}
workloadReplicas:
  rogue: 1
workloads:
  rogue:
    replicaCount: 1
