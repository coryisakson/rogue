# Tag of the agents sidecar image (cisakson/rogue-agents); version lives in sidecar/VERSION.
agentsImageTag: "0.8.0"
workloads:
  rogue:
    replicaCount: 1

# Olares Router endpoint for local AI (OpenAI-compatible). Empty until confirmed (APPROVALS RGE-A12).
rogueAiBaseUrl: "http://3a77b15d.shared.olares.com/v1"
# Multilingual chat on another OpenAI-compatible endpoint (e.g. https://api.anthropic.com/v1), only after RGE-A18 is approved.
# Empty = every language stays on the default model. The API key is never a chart value (app secret, see RGE-A18).
rogueAiMultiBaseUrl: ""
rogueAiMultiModel: ""
# Web search for game intake and the Scout: a SearXNG root URL (JSON API). Empty = search off; requests then go to an admin for manual research.
rogueSearchBaseUrl: "http://84a93c3c.cisakson.olares.local"
# OCR: set to your PaddleOCR service root to use it (empty = built-in tesseract command)
# MinerU API (mineru-kit api-server, entrance mineruapi). Previous engine: PaddleOCR-VL at http://43279715.shared.olares.com (set rogueOcrProvider: http to go back).
rogueOcrProvider: "mineru"
rogueOcrAllPages: "1"
rogueMineruTier: "advanced"
rogueMineruOcrMode: "ocr"
rogueOcrBaseUrl: "http://75f353a31.cisakson.olares.local"
rogueOcrApiKey: ""

# Discord bot (public identifiers only; the bot token is never stored in the app). Empty = bot route returns 404.
rogueDiscordAppId: "1560305840546648118"
rogueDiscordPublicKey: "3fb5a0277ad9cb13de4a3b1e95944265eeba9788ebfdfb77b58065c298911238"
